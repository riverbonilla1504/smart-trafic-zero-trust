# Solo AMQP con TLS: el puerto 5672 en claro queda deshabilitado.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.crt
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Panel de administracion: el compose lo publica solo en 127.0.0.1 (se usa por tunel SSH).
management.tcp.port = 15672

# La maquina es pequena: limites explicitos de memoria y disco.
vm_memory_high_watermark.absolute = 400MB
disk_free_limit.absolute = 1GB
