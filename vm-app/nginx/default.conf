# Clases 5 y 10: bastionado de Nginx. La imagen sin privilegios escucha en 8080, 8443 y 9443;
# Docker los publica como 80, 443 y 9443.

server_tokens off;

# Rate limiting: 5 peticiones/s por IP con rafaga de 10, como en el laboratorio de la clase 10.
limit_req_zone $binary_remote_addr zone=zona_defensa:10m rate=5r/s;
# Los estaticos de Next.js (JS/CSS con hash) se piden en grupo al cargar una pagina: zona aparte.
limit_req_zone $binary_remote_addr zone=estaticos:10m rate=30r/s;
# Agentes: como mucho 2 reportes/s por certificado.
limit_req_zone $ssl_client_s_dn zone=agentes:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conexiones_ip:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# El dashboard envia su propia CSP con nonce por peticion. Las respuestas que genera Nginx
# (401, 429, errores) no traen ninguna: para esas se usa una CSP que no permite nada.
# Una cabecera con valor vacio no se envia.
map $upstream_http_content_security_policy $csp_fallback {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}

# HTTP solo redirige a HTTPS.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_tickets off;

    # Cabeceras defensivas. "always" las envia tambien en respuestas de error.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $csp_fallback always;

    limit_req zone=zona_defensa burst=10 nodelay;
    limit_conn conexiones_ip 20;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Acceso al dashboard con usuario y contrasena (hash con sal en htpasswd).
    auth_basic "Smart Traffic";
    auth_basic_user_file /etc/nginx/tls/htpasswd;

    # Comprobacion de vida para Docker: sin datos y sin credenciales.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La recepcion de reportes solo existe en la pasarela con TLS mutuo (puerto 9443).
    location ^~ /api/agent/ {
        return 404;
    }

    location ^~ /_next/static/ {
        limit_req zone=estaticos burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://security_dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Gateway-Token "";
        proxy_set_header X-Agent-Verify "";
        proxy_set_header X-Agent-DN "";
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://security_dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Un cliente no puede hacerse pasar por la pasarela de agentes.
        proxy_set_header X-Gateway-Token "";
        proxy_set_header X-Agent-Verify "";
        proxy_set_header X-Agent-DN "";
        proxy_set_header X-Agent-Fingerprint "";
        proxy_read_timeout 30s;
    }

    # Eventos en vivo. /push del backend queda fuera de internet.
    location = /ws {
        proxy_pass http://user_dashboard_backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }
}

# Pasarela de monitoreo (solo red interna): cada agente presenta su certificado de cliente.
# Sin certificado firmado por la CA interna, la conexion se corta en el handshake TLS.
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/report.crt;
    ssl_certificate_key /etc/nginx/tls/report.key;
    ssl_client_certificate /etc/nginx/tls/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 512k;
    client_body_timeout 10s;
    limit_req zone=agentes burst=5 nodelay;

    location = /report {
        limit_except POST { deny all; }
        # Solo certificados de agente; el dashboard comprueba ademas que el CN coincide con la maquina.
        if ($ssl_client_s_dn !~ "CN=agent-(bastion|app|auth|ingest|core|data)(,|$)") {
            return 403;
        }
        proxy_pass http://security_dashboard:3000/api/agent/report;
        proxy_http_version 1.1;
        proxy_set_header Host report-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Agent-Verify $ssl_client_verify;
        proxy_set_header X-Agent-DN $ssl_client_s_dn;
        proxy_set_header X-Agent-Fingerprint $ssl_client_fingerprint;
        include /etc/nginx/tls/gateway-token.conf;
    }

    location / {
        return 404;
    }
}
