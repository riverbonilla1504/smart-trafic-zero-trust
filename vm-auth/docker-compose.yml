services:
  auth-server:
    build: ./auth-server
    image: smarttraffic/auth-server:local
    container_name: auth-server
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      TOKEN_EXPIRES_IN: "300"
    volumes:
      - ./secrets:/run/app-secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
