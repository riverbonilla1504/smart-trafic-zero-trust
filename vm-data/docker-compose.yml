x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "10.0.5.10:9092:9092" # Solo en la IP privada, con TLS mutuo
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      # --- KRaft (sin ZooKeeper) ---
      CLUSTER_ID: "Jc83HgZES8Opf-6cxduOJg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners de Kafka:
      # - INTERNAL y CONTROLLER: solo dentro de la red de Docker de esta maquina
      # - EXTERNAL: acceso desde otras VMs, cifrado y con certificado de cliente obligatorio
      KAFKA_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://10.0.5.10:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:SSL,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # --- TLS mutuo en el listener EXTERNAL ---
      KAFKA_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_SSL_KEYSTORE_LOCATION: "/etc/kafka/tls/keystore.pem"
      KAFKA_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/tls/ca.pem"
      KAFKA_SSL_CLIENT_AUTH: "required"

      # --- Configuración de un solo nodo ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # El disco es limitado: conservar 48 h de eventos.
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/tls:ro
    # Bastionado: usuario appuser (1000) de la imagen, sin capacidades y raiz de solo lectura.
    # La imagen genera kafka.properties en /etc/kafka al arrancar: ahi va un tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /etc/kafka:uid=1000,gid=1000,mode=0755
      - /var/log/kafka:uid=1000,gid=1000,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 1g
    logging: *logging
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    # El nombre del nodo (rabbit@<hostname>) decide donde guarda usuarios y colas:
    # fijo, para que sobrevivan a una recreacion del contenedor.
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "10.0.5.10:5671:5671"       # AMQP con TLS, solo en la IP privada
      - "127.0.0.1:15672:15672"     # Panel web: solo por túnel SSH
    environment:
      # Administrador; los servicios usan usuarios propios con permisos mínimos.
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_ADMIN_PASSWORD:?falta en .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/90-smarttraffic.conf:ro
      - ./secrets/rabbitmq:/etc/rabbitmq/tls:ro
    # Bastionado: arranca directamente como el usuario rabbitmq (999), no como root.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 640m
    logging: *logging
    networks:
      - backend

volumes:
  kafka-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
