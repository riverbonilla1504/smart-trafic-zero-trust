# Docker compose file for the app services (DMZ).
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 100
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Nginx: unico punto de entrada (clases 5 y 10). 9443 es la pasarela de los agentes,
  # abierta solo para los grupos de seguridad del proyecto.
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: nginx
    depends_on:
      - security_dashboard
      - user_dashboard_backend
    ports:
      - "80:8080"
      - "443:8443"
      - "9443:9443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/nginx:/etc/nginx/tls:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webnet
      - appnet

  # Dashboard de seguridad (Next.js). Solo Nginx llega a el: vive en su propia red.
  security_dashboard:
    <<: *hardening
    build: ./security_dashboard
    image: smarttraffic/security-dashboard:local
    container_name: security_dashboard
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      PUBLIC_IP: "${PUBLIC_IP:?falta en .env}"
      CA_FILE: "/run/app-secrets/ca.pem"
      GATEWAY_TOKEN_FILE: "/run/app-secrets/gateway-token"
      EVIDENCE_DIR: "/evidence"
      DATA_DIR: "/data"
      NGINX_HOST: "nginx"
    volumes:
      - ./secrets/dashboard:/run/app-secrets:ro
      - ./evidence:/evidence:ro
      - dashboard_state:/data
    expose:
      - "3000"
    mem_limit: 320m
    networks:
      - webnet

  # Alert dispatcher service.
  alert_dispatcher:
    <<: *hardening
    build: ./alert_dispatcher
    image: smarttraffic/dispatcher:local
    container_name: alert_dispatcher
    depends_on:
      - user_dashboard_backend
    environment:
      AUTH_URL: "https://10.0.2.10/token"
      AUTH_CLIENT_ID: "dispatcher"
      AUTH_CLIENT_SECRET: "${AUTH_DISPATCHER_SECRET:?falta en .env}"
      RABBITMQ_URL: "amqps://dispatcher:${RABBITMQ_DISPATCHER_PASSWORD:?falta en .env}@10.0.5.10:5671"
      NODE_EXTRA_CA_CERTS: "/run/app-secrets/ca.pem"
    volumes:
      - ./secrets/ca.pem:/run/app-secrets/ca.pem:ro
    mem_limit: 192m
    networks:
      - appnet

  # Backend del WebSocket de eventos. No publica puertos: solo Nginx llega a el.
  user_dashboard_backend:
    <<: *hardening
    build: ./user_dashboard_backend
    image: smarttraffic/dashboard:local
    container_name: user_dashboard_backend
    expose:
      - "8080"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - appnet

  # Query client service.
  query_client:
    <<: *hardening
    build: ./query_client
    image: smarttraffic/query:local
    container_name: query_client
    depends_on:
      - user_dashboard_backend
    environment:
      RABBITMQ_URL: "amqps://query:${RABBITMQ_QUERY_PASSWORD:?falta en .env}@10.0.5.10:5671"
      NODE_EXTRA_CA_CERTS: "/run/app-secrets/ca.pem"
    volumes:
      - ./secrets/ca.pem:/run/app-secrets/ca.pem:ro
    mem_limit: 128m
    networks:
      - appnet

volumes:
  dashboard_state:

networks:
  # Nginx y el dashboard de seguridad.
  webnet:
    driver: bridge
  # Nginx, el backend del WebSocket y los servicios de mensajeria.
  appnet:
    driver: bridge
