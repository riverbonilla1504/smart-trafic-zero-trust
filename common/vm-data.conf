#!/usr/sbin/nft -f
# data-ec2 (10.0.5.10). Kafka y RabbitMQ solo para los servicios que los usan.
# No usa "flush ruleset": borraria las reglas de NAT y red que crea Docker.
table inet hostfw
delete table inet hostfw

table inet hostfw {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state invalid drop
    ct state established,related accept
    ip saddr 10.0.0.10 tcp dport 22 accept
    limit rate 5/minute log prefix "hostfw-input-drop: "
  }

  chain forward {
    type filter hook forward priority -10; policy drop;
    ct state invalid drop
    ct state established,related accept
    iifname { "docker0", "br-*" } oifname { "docker0", "br-*" } accept

    # Kafka con TLS mutuo: solo ingest y core
    iifname "ens5" ct status dnat ip saddr { 10.0.3.10, 10.0.4.10 } tcp dport 9092 accept
    # RabbitMQ con TLS: solo core y app
    iifname "ens5" ct status dnat ip saddr { 10.0.4.10, 10.0.1.10 } tcp dport 5671 accept

    # Salida de contenedores (DNS e imagenes); el grupo de seguridad decide si llega a internet
    iifname { "docker0", "br-*" } oifname "ens5" ip daddr 10.0.0.2 meta l4proto { tcp, udp } th dport 53 accept
    iifname { "docker0", "br-*" } oifname "ens5" tcp dport 443 accept
    limit rate 5/minute log prefix "hostfw-forward-drop: "
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    oifname { "docker0", "br-*" } accept
    ip daddr 10.0.0.2 meta l4proto { tcp, udp } th dport 53 accept
    ip daddr 169.254.169.123 udp dport 123 accept
    tcp dport { 80, 443 } accept
    limit rate 5/minute log prefix "hostfw-output-drop: "
  }
}
