# Clases 5 y 10: bastionado de Nginx. La imagen sin privilegios escucha en 8080 y 8443;
# Docker los publica como 80 y 443.

server_tokens off;

# Rate limiting: 5 peticiones/s por IP con rafaga de 10, como en el laboratorio de la clase 10.
limit_req_zone $binary_remote_addr zone=zona_defensa:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conexiones_ip:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP solo redirige a HTTPS.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_tickets off;

    # Cabeceras defensivas. "always" las envia tambien en respuestas de error.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'" always;

    limit_req zone=zona_defensa burst=10 nodelay;
    limit_conn conexiones_ip 20;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Acceso al dashboard con usuario y contrasena (hash con sal en htpasswd).
    auth_basic "Smart Traffic";
    auth_basic_user_file /etc/nginx/tls/htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    # Solo se publica el WebSocket: /push del backend queda fuera de internet.
    location = /ws {
        proxy_pass http://user_dashboard_backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }
}
